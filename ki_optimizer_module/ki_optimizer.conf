# ==============================================================================
#  Ki-Kernel Optimizer Configuration
#  Location: /sdcard/ki_optimizer.conf
#  You can edit this file anytime using any text editor or MT Manager!
#  After editing, apply immediately via Termux: su -c ki reload
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CPU PROFILE (ki_profile)
#    0 = Battery Saver     (Efficient, power saving, cool CPU clocks)
#    1 = Balanced          (Default, balance between performance and battery)
#    2 = Performance       (Turbo Gaming, maximum responsiveness, unlocked boost)
# ------------------------------------------------------------------------------
KI_PROFILE=1

# ------------------------------------------------------------------------------
# 2. MULTI-GEN LRU (MGLRU)
#    1 = Standard (0x0001: Core generational LRU - Recommended for Android stability)
#    7 = Turbo    (0x0007: Core + Page Table Walk)
#    0 = Disabled (Traditional 2-List LRU)
# ------------------------------------------------------------------------------
MGLRU_MODE=1
MGLRU_ENABLED=1

# ------------------------------------------------------------------------------
# 3. BYPASS CHARGING (Direct Wall Power)
#    1 = Enabled  (Direct power from charger, battery not charged -> zero gaming heat)
#    0 = Disabled (Normal battery charging)
# ------------------------------------------------------------------------------
BYPASS_CHARGING=0

# ------------------------------------------------------------------------------
# 4. FAST CHARGING ENHANCEMENTS
#    SCREEN_ON_FAST_CHARGE: Keep fast charging rate when screen is on (1=On, 0=Off)
#    FORCE_FAST_CHARGE    : Bypass thermal charge rate throttling (1=On, 0=Off)
# ------------------------------------------------------------------------------
SCREEN_ON_FAST_CHARGE=0
FORCE_FAST_CHARGE=0

# ------------------------------------------------------------------------------
# 5. IN-KERNEL THERMAL & SCREEN-OFF DEFENSE
#    SCREEN_OFF_BATTERY: Automatically enter Battery mode when screen is off (1=On, 0=Off)
#    THERMAL_THROTTLE  : Kernel thermal guard (1=Safe/Dynamic, 0=Disabled/Gaming)
# ------------------------------------------------------------------------------
SCREEN_OFF_BATTERY=0
THERMAL_THROTTLE=1

# ------------------------------------------------------------------------------
# 6. WAKELOCK BLOCKER
#    1 = Enabled (Blocks non-critical background wakeups to reduce idle battery drain)
#    0 = Disabled (Default)
# ------------------------------------------------------------------------------
WAKELOCK_BLOCKER=0

# ------------------------------------------------------------------------------
# 6. STORAGE & FILESYSTEM (Dynamic Fsync)
#    1 = Enabled (Ultra-fast storage I/O when screen is on, safe sync when screen off)
#    0 = Disabled (Standard Linux synchronous fsync)
# ------------------------------------------------------------------------------
DYNAMIC_FSYNC=1

# ------------------------------------------------------------------------------
# 7. NETWORK & GAMING PING (TCP Congestion Control)
#    bbr3         : Google BBRv3 (Latest upstream BBRv3 congestion control)
#    bbr          : Google BBR (BBRv1: stable, low jitter, anti packet loss)
#    westwood     : Westwood+ (Great for wireless lossy Wi-Fi/cellular)
#    cubic        : Linux default CUBIC
# ------------------------------------------------------------------------------
TCP_CONGESTION=bbr

# ------------------------------------------------------------------------------
# 8. MEMORY & VIRTUAL MEMORY TUNING
#    SWAPPINESS        : Preference for paging to zRAM (Recommended: 80 - 130)
#    VFS_CACHE_PRESSURE: Directory & inode cache reclamation ratio (Default: 80 - 100)
# ------------------------------------------------------------------------------
SWAPPINESS=80
VFS_CACHE_PRESSURE=80

# ------------------------------------------------------------------------------
# 9. I/O DISK SCHEDULER
#    maple : Maple Tree scheduler (Optimized for Android flash storage)
#    none  : Direct hardware multi-queue UFS 3.1 dispatch
#    bfq   : Budget Fair Queueing
# ------------------------------------------------------------------------------
IO_SCHEDULER=maple
