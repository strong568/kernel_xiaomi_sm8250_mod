name: Build KittySU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        branch: [main, dev]

    steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Clone and Build KittySU (${{ matrix.branch }})
      id: build
      run: |
        git clone -b ${{ matrix.branch }} https://github.com/terebiko/KittiSU.git kitty
        cd kitty/manager
        chmod +x ./gradlew
        
        # 1. Build bản Release chính thức
        ./gradlew assembleRelease
        
        # Lưu APK bản gốc
        mkdir -p ../../output_apks
        for file in app/build/outputs/apk/release/*.apk; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            cp "$file" "../../output_apks/${{ matrix.branch }}_${filename}"
          fi
        done

        # 2. Tạo Package Name ngẫu nhiên để Spoof
        RANDOM_SUFFIX=$(head /dev/urandom | tr -dc a-z0-9 | head -c 8)
        SPOOF_PKG="com.google.android.ext.${RANDOM_SUFFIX}"
        echo "Building Spoofed APK with ID: $SPOOF_PKG"

        # Thay thế applicationId trong file cấu hình gradle
        sed -i "s/applicationId = \".*\"/applicationId = \"$SPOOF_PKG\"/g" app/build.gradle.kts 2>/dev/null || true
        sed -i "s/applicationId \".*\"/applicationId \"$SPOOF_PKG\"/g" app/build.gradle 2>/dev/null || true

        # Build bản Spoof
        ./gradlew assembleRelease

        # Lưu APK bản Spoofed
        for file in app/build/outputs/apk/release/*.apk; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            cp "$file" "../../output_apks/${{ matrix.branch }}_spoofed_${filename}"
          fi
        done
        
        cd ..
        VERSION_NAME=$(git describe --tags --always)
        echo "$VERSION_NAME" > version.txt
        cp version.txt ../output_apks/version_${{ matrix.branch }}.txt

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: KittySU-APKs-${{ matrix.branch }}
        path: output_apks/*

  release:
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release_artifacts
        pattern: KittySU-APKs-*
        merge-multiple: true

    - name: Get Date and Version
      id: vars
      run: |
        DATE=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y')
        echo "date=$DATE" >> $GITHUB_OUTPUT
        
        if [ -f "./release_artifacts/version_main.txt" ]; then
          VERSION=$(cat ./release_artifacts/version_main.txt)
        elif [ -f "./release_artifacts/version_dev.txt" ]; then
          VERSION=$(cat ./release_artifacts/version_dev.txt)
        else
          VERSION=$(date +'%Y%m%d_%H%M')
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: Manager
        name: "KittiSU Manager"
        body: "Bản build tự động cho KittiSU (Gồm bản gốc và bản spoofed package)."
        draft: false
        prerelease: false
        files: ./release_artifacts/*.apk
