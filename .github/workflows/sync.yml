name: Sync with Upstream

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cho phép GitHub Actions quyền ghi vào repository của bạn
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }} # Dùng token mặc định có sẵn của GitHub

      - name: Set Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull and Push upstream changes
        run: |
          git remote add upstream https://github.com/Luckyfr1945/kernel_xiaomi_sm8250_mod.git
          git fetch upstream ki-kernel-clean-stable
          git checkout ki-kernel-clean-stable || git checkout -b ki-kernel-clean-stable upstream/ki-kernel-clean-stable
          git merge upstream/ki-kernel-clean-stable --no-edit
          git push origin ki-kernel-clean-stable
