name: Sync with Upstream

on:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync upstream changes
        uses: wei/git-sync@v3
        with:
          source_repo: "https://github.com/Luckyfr1945/kernel_xiaomi_sm8250_mod.git"
          source_branch: "ki-kernel-clean-stable"
          destination_repo: "https://github.com/strong568/kernel_xiaomi_sm8250_mod.git"
          destination_branch: "ki-kernel-clean-stable"
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Hoặc nếu dùng Personal Access Token, bạn có thể truyền token tuỳ theo cách cấu hình của action này.
