name: Build Ki-Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Chọn nhánh (Branch) để build kernel'
        required: true
        default: 'ki-kernel-clean-stable'
        type: string
      target_device:
        description: 'Target Device (munch, alioth, apollo, lmi, umi...)'
        required: true
        default: 'munch'
      ksu_flavor:
        description: 'Chọn loại KSU hoặc Noksu'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - resukisu
          - kernelsu-next
          - sukisu-ultra
          - midori
          - noksu
      variant:
        description: 'Chế độ SuSFS (Chỉ áp dụng khi chọn KSU)'
        required: true
        type: choice
        default: 'susfs'
        options:
          - susfs
          - nosusfs
      target_os:
        description: 'Target OS (aosp, miui, coloros, both, all)'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - both
          - aosp
          - miui
          - coloros

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.kernel_branch }}
          submodules: false
          fetch-depth: 1
          clean: true


      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            crossbuild-essential-arm64 crossbuild-essential-armhf libarchive-tools \
            zip unzip tar wget git curl python3 libzstd-dev jq ccache

      - name: Setup ZyCromerZ Clang 16
        run: |
          mkdir -p $HOME/zyc-clang
          echo "Downloading ZyCromerZ Clang 16..."
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o /tmp/zyc-clang.tar.gz
          tar -xzf /tmp/zyc-clang.tar.gz -C $HOME/zyc-clang/
          rm -f /tmp/zyc-clang.tar.gz

          mkdir -p $HOME/proton-clang
          ln -sfn "$HOME/zyc-clang" "$HOME/proton-clang/proton-clang-20210522"
          echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

      - name: Setup KernelSU & Auto-Fix Missing Headers/Kconfigs
        run: |
          FLAVOR="${{ github.event.inputs.ksu_flavor }}"
          VARIANT="${{ github.event.inputs.variant }}"

          # Gỡ hoàn toàn submodule KernelSU khỏi Git index để tránh lỗi Post-job cleanup
          git rm --cached -f KernelSU 2>/dev/null || true
          git config -f .gitmodules --remove-section submodule.KernelSU 2>/dev/null || true
          rm -rf KernelSU drivers/kernelsu

          if [ "$FLAVOR" = "noksu" ]; then
            echo "[-] Building in Noksu mode (No KernelSU)"
            mkdir -p drivers/kernelsu
            touch drivers/kernelsu/Kconfig drivers/kernelsu/Makefile
          else
            echo "[+] Cloning KernelSU flavor: $FLAVOR (Mode:$VARIANT)"
            case "$FLAVOR" in
              resukisu)
                git clone https://github.com/Baka-SU/BakaSU.git -b main KernelSU
                ;;
              kernelsu-next)
                git clone https://github.com/KernelSU-Next/KernelSU-Next.git -b legacy KernelSU
                ;;
              sukisu-ultra)
                git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git -b main KernelSU
                ;;
              midori)
                git clone https://github.com/midori01/KernelSU.git -b main KernelSU
                ;;
            esac

            if [ -d "KernelSU/kernel" ]; then
              ln -sfn ../KernelSU/kernel drivers/kernelsu
            else
              ln -sfn ../KernelSU drivers/kernelsu
            fi


            # 1. Sửa lỗi BakaSU / SukiSU chặn build tại susfs_compat.mk
            find KernelSU -type f \( -name "*.mk" -o -name "Makefile" \) -exec sed -i 's/\$(error /$(warning /g' {} + 2>/dev/null || true

            # 2. Chuyển toàn bộ CONFIG_KSU_MANUAL_HOOK sang CONFIG_KSU
            for hook_file in fs/exec.c fs/open.c fs/read_write.c fs/stat.c fs/namei.c drivers/input/input.c drivers/tty/pty.c; do
              if [ -f "$hook_file" ]; then
                sed -i 's/CONFIG_KSU_MANUAL_HOOK/CONFIG_KSU/g' "$hook_file"
              fi
            done
          fi

          # Fix lỗi undefined symbol: trace_clock_local trong drivers/android/binder.c
          python3 - << 'EOF'
          import os, re

          binder_path = "drivers/android/binder.c"
          if os.path.exists(binder_path):
              with open(binder_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              weak_trace_clock = """
          #include <linux/sched/clock.h>
          u64 __attribute__((weak)) trace_clock_local(void)
          {
              return local_clock();
          }
          """
              if "trace_clock_local" in content and "__attribute__((weak)) trace_clock_local" not in content:
                  # Chèn ngay sau dòng #include đầu tiên trong binder.c
                  content = re.sub(r'(#include\s+<[^>]+>)', r'\1\n' + weak_trace_clock.strip(), content, count=1)
                  with open(binder_path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("[+] Injected weak fallback for trace_clock_local() in drivers/android/binder.c")
          EOF

          
          # 3. Fix lỗi fs/stat.c thiếu khai báo ksu_handle_newfstat_ret và ksu_handle_fstat64_ret
          python3 - << 'EOF'
          import os
          stat_path = "fs/stat.c"
          if os.path.exists(stat_path):
              with open(stat_path, "r") as f:
                  c = f.read()
              weak_hooks = """
          void __attribute__((weak)) ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr) {}
          #if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)
          void __attribute__((weak)) ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr) {}
          #endif
          """
              if "ksu_handle_newfstat_ret" in c and "__attribute__((weak)) ksu_handle_newfstat_ret" not in c:
                  target = "extern int ksu_handle_stat"
                  if target in c:
                      c = c.replace(target, weak_hooks.strip() + "\n" + target, 1)
                  else:
                      c = weak_hooks.strip() + "\n" + c
                  with open(stat_path, "w") as f:
                      f.write(c)
                  print("[+] Injected weak prototypes for ksu_handle_newfstat_ret & ksu_handle_fstat64_ret in fs/stat.c")
          EOF

          # 4. Fix lỗi incomplete type 'struct bbg_cred_security_struct' trong SELinux
          rm -f security/selinux/include/bbg_tracing.h include/linux/bbg_tracing.h
          mkdir -p security/selinux/include include/linux

          cat << 'EOF' > security/selinux/include/bbg_tracing.h
          #ifndef _BBG_TRACING_H
          #define _BBG_TRACING_H
          struct bbg_cred_security_struct {
              int unused;
          };
          static inline void bbg_JvmCheck(void) {}
          static inline int bbg_process_setexec(void) { return 0; }
          #endif
          EOF
          cp -f security/selinux/include/bbg_tracing.h include/linux/bbg_tracing.h

          if [ -f "security/selinux/include/objsec.h" ]; then
            sed -i '/bbg_cred/d' security/selinux/include/objsec.h
          fi

          # 5. Quét Kconfig an toàn
          python3 - << 'EOF'
          import os, re
          pattern = re.compile(r'^\s*source\s+["\']?([^"\'\s]+Kconfig[^"\'\s]*)["\']?')
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs:
                  dirs.remove('.git')
              for f in files:
                  if f.startswith('Kconfig'):
                      kpath = os.path.join(root, f)
                      try:
                          with open(kpath, 'r', encoding='utf-8', errors='ignore') as fp:
                              lines = fp.readlines()
                      except Exception:
                          continue
                      new_lines = []
                      modified = False
                      for line in lines:
                          m = pattern.match(line)
                          if m:
                              target = m.group(1)
                              if '$' not in target and not os.path.isfile(target):
                                  modified = True
                                  continue
                          new_lines.append(line)
                      if modified:
                          with open(kpath, 'w', encoding='utf-8') as fp:
                              fp.writelines(new_lines)
          EOF

          # Dọn dẹp Makefile
          sed -i '/nomount/d' fs/Makefile 2>/dev/null || true
          sed -i '/baseband-guard/d' security/Makefile 2>/dev/null || true
          sed -i '/bbg/d' security/selinux/Makefile 2>/dev/null || true

          # 6. Chuẩn bị template AnyKernel
          mkdir -p anykernel_template
          if [ -d "anykernel" ]; then
            cp -rn anykernel/. anykernel_template/ 2>/dev/null || true
          fi
          if [ -f "anykernel.sh" ] && [ ! -f "anykernel_template/anykernel.sh" ]; then
            cp -f anykernel.sh anykernel_template/anykernel.sh
          fi

          # 7. Patch Multi-Manager (Hỗ trợ KSU, KSUN, SukiSU, BakaSU, KowSU, RKSU, MidoriSU)
          python3 - << 'EOF'
          import os, glob, re

          # Tìm file apk_sign.c trong thư mục KernelSU
          sign_files = glob.glob("KernelSU/**/apk_sign.c", recursive=True)
          for path in sign_files:
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()

              # Danh sách cặp (EXPECTED_SIZE, EXPECTED_HASH) của các Manager phổ biến
              multi_check = """
              return check_v2_signature(path, EXPECTED_SIZE, EXPECTED_HASH)
                  || check_v2_signature(path, 0x033b, "c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6") /* Official KSU / KowSU / backslashxx */
                  || check_v2_signature(path, 0x3e6, "79e590113c4c4c0c222978e413a5faa801666957b1212a328e46c00c69821bf7")  /* KernelSU-Next (KSUN) */
                  || check_v2_signature(path, 0x368, "b9ee6759de4794f954883458b722b97ae6527cb7709a051db9a2348c0eea1e42")  /* MidoriSU */
                  || check_v2_signature(path, 0x35c, "947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef")  /* SukiSU-Ultra */
                  || check_v2_signature(path, 0x377, "d3469712b6214462764a1d8d3e5cbe1d6819a0b629791b9f4101867821f1df64") /* BakaSU / ReSukiSU */
                  || check_v2_signature(path, 0x396, "f415f4ed9435427e1fdf7f1fccd4dbc07b3d6b8751e4dbcec6f19671f427870b"); /* rsuntk RKSU */
              """

              pattern = r"return\s+check_v2_signature\s*\(\s*path\s*,\s*EXPECTED_SIZE\s*,\s*EXPECTED_HASH\s*\)\s*;"
              if re.search(pattern, content):
                  content = re.sub(pattern, multi_check.strip(), content)
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"[+] Patched Multi-Manager support into {path}")
          EOF
 
          # 8. Fix lỗi Clang 16 bắt bẻ unused functions trong drivers/scsi/ufs/ufshcd.c
          python3 - << 'EOF'
          import os
          ufshcd_path = "drivers/scsi/ufs/ufshcd.c"
          if os.path.exists(ufshcd_path):
              with open(ufshcd_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              
              # Thêm __maybe_unused vào trước các hàm bị Clang 16 bắt lỗi
              content = content.replace("static void ufshcd_add_cmd_upiu_trace", "static __maybe_unused void ufshcd_add_cmd_upiu_trace")
              content = content.replace("static void __ufshcd_cmd_log", "static __maybe_unused void __ufshcd_cmd_log")
              
              with open(ufshcd_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("[+] Successfully patched unused functions in drivers/scsi/ufs/ufshcd.c")
          EOF

          # 9. Fix chuẩn lỗi thiếu <linux/module.h> trong rpmh-rsc.c (kiểm tra pr_fmt có sẵn) & Export SELinux symbols cho BakaSU
          python3 - << 'EOF'
          import os, re

          # 9.1. Thêm <linux/module.h> vào rpmh-rsc.c một cách an toàn (tránh đè lên pr_fmt dòng 7)
          rsc_path = "drivers/soc/qcom/rpmh-rsc.c"
          if os.path.exists(rsc_path):
              with open(rsc_path, "r", encoding="utf-8", errors="ignore") as f:
                  c = f.read()
              if "<linux/module.h>" not in c:
                  # Tìm vị trí sau khối định nghĩa pr_fmt hoặc sau include đầu tiên
                  if "#define pr_fmt" in c:
                      c = c.replace('#define pr_fmt(fmt) "%s " fmt, KBUILD_MODNAME', '#define pr_fmt(fmt) "%s " fmt, KBUILD_MODNAME\n#include <linux/module.h>')
                  else:
                      c = re.sub(r'(#include\s+<linux/[^>]+>)', r'\1\n#include <linux/module.h>', c, count=1)
                  with open(rsc_path, "w", encoding="utf-8") as f:
                      f.write(c)
                  print("[+] Added #include <linux/module.h> safely into rpmh-rsc.c")

          # 9.2. Export 3 symbols SELinux cho BakaSU khi tắt CONFIG_KALLSYMS_ALL
          selinuxfs_path = "security/selinux/selinuxfs.c"
          if os.path.exists(selinuxfs_path):
              with open(selinuxfs_path, "r", encoding="utf-8", errors="ignore") as f:
                  c = f.read()
              if "sel_handle_status_ops" in c:
                  c = re.sub(r'\bstatic\s+(const\s+struct\s+file_operations\s+sel_handle_status_ops\b)', r'\1', c)
                  with open(selinuxfs_path, "w", encoding="utf-8") as f:
                      f.write(c)
                  print("[+] Exported sel_handle_status_ops in security/selinux/selinuxfs.c")

          services_path = "security/selinux/ss/services.c"
          if os.path.exists(services_path):
              with open(services_path, "r", encoding="utf-8", errors="ignore") as f:
                  c = f.read()
              c = re.sub(r'\bstatic\s+(void\s+security_dump_masked_av\b)', r'\1', c)
              c = re.sub(r'\bstatic\s+(void\s+context_struct_compute_av\b)', r'\1', c)
              with open(services_path, "w", encoding="utf-8", errors="ignore") as f:
                  f.write(c)
              print("[+] Exported security_dump_masked_av & context_struct_compute_av in security/selinux/ss/services.c")
          EOF

          # 9.3. Đồng bộ cấu hình build.sh cho mọi loại KSU Flavor (BakaSU, SukiSU-Ultra, KSUN, Midori...)
          if [ -f "build.sh" ]; then
            # 1. Giữ KALLSYMS và KALLSYMS_ALL để symbol_resolver (BakaSU/SukiSU) không bị lỗi bootloop/mất root
            sed -i 's/-d KALLSYMS_ALL/-e KALLSYMS -e KALLSYMS_ALL/g' build.sh
            
            # 2. Bật KSU_MANUAL_HOOK (vì bước 2 đã gộp hook và tắt KPROBES, nếu để -d sẽ làm mất hook trên SukiSU/KSUN)
            sed -i 's/-d KSU_MANUAL_HOOK/-e KSU_MANUAL_HOOK/g' build.sh

            echo "[+] Patched build.sh for Universal Multi-KSU & Manager compatibility"
          fi


          # 10. Tự động ép giá trị mặc định của /proc/fast_charge thành 1 trong mã nguồn
          python3 - << 'EOF'
          import os, re

          # Quét tìm các tệp nguồn định nghĩa fast_charge trong thư mục drivers hoặc fs
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs:
                  dirs.remove('.git')
              for file in files:
                  if file.endswith('.c'):
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          
                          # Kiểm tra xem tệp có chứa proc entry fast_charge hay không
                          if 'fast_charge' in content and 'proc_create' in content:
                              # Thay thế các biến khởi tạo giá trị từ 0 thành 1
                              new_content = re.sub(r'(\b[a-zA-Z0-9_]*fast_charge[a-zA-Z0-9_]*\s*=\s*)0(\s*;)', r'\g<1>1\2', content)
                              if new_content != content:
                                  with open(path, 'w', encoding='utf-8') as f:
                                      f.write(new_content)
                                  print(f"[+] Patched default fast_charge = 1 in {path}")
                      except Exception:
                          continue
          EOF
          
                                      
      - name: Fetch Latest KernelSU Manager APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p manager_output
          FLAVOR="${{ github.event.inputs.ksu_flavor }}"

          if [ "$FLAVOR" != "noksu" ]; then
            REPO=""
            case "$FLAVOR" in
              resukisu)      REPO="Baka-SU/BakaSU" ;;
              kernelsu-next) REPO="KernelSU-Next/KernelSU-Next" ;;
              sukisu-ultra)  REPO="SukiSU-Ultra/SukiSU-Ultra" ;;
              midori)        REPO="midori01/KernelSU" ;;
            esac

            echo "Fetching latest Manager APK from $REPO..."
            AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
            ALL_RELEASES=$(curl -sL -H "$AUTH_HEADER" "https://api.github.com/repos/$REPO/releases")
            APK_URL=$(echo "$ALL_RELEASES" | jq -r 'if type == "array" then .[].assets[]? else empty end | select(.name? | endswith(".apk")) | .browser_download_url' 2>/dev/null | head -n 1)
            APK_NAME=$(echo "$ALL_RELEASES" | jq -r 'if type == "array" then .[].assets[]? else empty end | select(.name? | endswith(".apk")) | .name' 2>/dev/null | head -n 1)

            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              wget -q "$APK_URL" -O "manager_output/${FLAVOR}_${APK_NAME}"
              echo "[+] Downloaded Manager APK: ${FLAVOR}_${APK_NAME}"
            else
              echo "[i] No APK found in $REPO releases (skipping APK download)."
            fi
          fi

      - name: Run Ki-Kernel Build Script
        run: |
          chmod +x build.sh
          [ -f "tools/hostcc" ] && chmod +x tools/hostcc || true

          if [ "${{ github.event.inputs.ksu_flavor }}" = "noksu" ]; then
            SCRIPT_VARIANT="noksu"
          elif [ "${{ github.event.inputs.variant }}" = "nosusfs" ]; then
            SCRIPT_VARIANT="nosusfs"
          else
            SCRIPT_VARIANT="ksu"
          fi

          bash build.sh "${{ github.event.inputs.target_device }}" "$SCRIPT_VARIANT" "${{ github.event.inputs.target_os }}"

      - name: Rename Zip with KSU Flavor & SuSFS Version
        run: |
          FLAVOR="${{ github.event.inputs.ksu_flavor }}"
          VARIANT="${{ github.event.inputs.variant }}"

          ORIGINAL_ZIP=$(ls *.zip release/*.zip 2>/dev/null | head -n 1)
          if [ -z "$ORIGINAL_ZIP" ]; then
            echo "Error: Kernel zip not found!"
            exit 1
          fi

          cp -f "$ORIGINAL_ZIP" ./ 2>/dev/null || true
          ORIGINAL_ZIP_NAME=$(basename "$ORIGINAL_ZIP")

          if [ "$FLAVOR" = "noksu" ]; then
            CUSTOM_TAG="NOKSU"
          else
            if [ "$VARIANT" = "susfs" ]; then
              SUSFS_VER=""

              # 1. Quét tìm chuỗi định nghĩa SUSFS_VERSION hoặc KSU_SUSFS_VERSION trong các tệp header (.h)
              SUSFS_VER=$(grep -rhoE '#define\s+(SUSFS_VERSION|CONFIG_SUSFS_VERSION)\s+"?[vV]?[0-9.]+"?' include/linux/ fs/ 2>/dev/null | head -n 1 | grep -oE '[0-9.]+')

              # 2. Nếu chưa thấy, quét tiếp trong các tệp Makefile hoặc .mk của susfs
              if [ -z "$SUSFS_VER" ]; then
                SUSFS_VER=$(grep -rnoE "SUSFS_VERSION\s*[:?]?=\s*v?[0-9.]+" KernelSU/ 2>/dev/null | head -n 1 | grep -oE '[0-9.]+')
              fi

              # 3. Fallback dự phòng: Quét bất kỳ chuỗi dạng vX.X.X nào có chữ susfs xung quanh trong mã nguồn
              if [ -z "$SUSFS_VER" ]; then
                SUSFS_VER=$(grep -rioE "susfs[-_ ]v?[0-9.]+" KernelSU/ fs/ 2>/dev/null | head -n 1 | grep -oE '[0-9.]+')
              fi

              # 4. Chuẩn hóa định dạng: Nếu quét được version (ví dụ: 2.3.0), ép thành v2.3.0. Nếu hoàn toàn không tìm thấy, lấy chữ "SuSFS" làm tên nhãn.
              if [ -n "$SUSFS_VER" ]; then
                SUSFS_VER="v${SUSFS_VER}"
                CUSTOM_TAG="${FLOUR:-$FLAVOR}-susfs-${SUSFS_VER}"
              else
                CUSTOM_TAG="${FLAVOR}-susfs-custom"
              fi
            else
              CUSTOM_TAG="${FLAVOR}-NoSuSFS"
            fi
          fi


          NEW_ZIP_NAME=$(echo "$ORIGINAL_ZIP_NAME" | sed "s/^[^_]*_/${CUSTOM_TAG}_/")
          if [ "$ORIGINAL_ZIP_NAME" != "$NEW_ZIP_NAME" ]; then
            mv "$ORIGINAL_ZIP_NAME" "$NEW_ZIP_NAME"
          fi

          echo "FINAL_ZIP_NAME=${NEW_ZIP_NAME%.zip}" >> $GITHUB_ENV
          echo "FINAL_ZIP_FILE=${NEW_ZIP_NAME}" >> $GITHUB_ENV
          echo "CUSTOM_TAG=${CUSTOM_TAG}" >> $GITHUB_ENV
          echo "[+] Final Flashable Zip: $NEW_ZIP_NAME"

      - name: Upload Kernel & Manager Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINAL_ZIP_NAME }}
          path: |
            ./*.zip
            manager_output/*.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./*.zip
            manager_output/*.apk
          tag_name: v1.4.1-${{ env.CUSTOM_TAG }}-${{ github.run_number }}
          name: "Ki-Kernel v1.4.1 (${{ env.CUSTOM_TAG }}) -${{ github.event.inputs.target_device }}"
          body: |
            ### Thông tin bản Build (Ki-Kernel v1.4.1)
            - **Nhánh (Branch)**: `${{ github.event.inputs.kernel_branch }}`
            - **Thiết bị (Target Device)**: `${{ github.event.inputs.target_device }}`
            - **Loại Root (KSU Flavor)**: `${{ github.event.inputs.ksu_flavor }}`
            - **Chế độ SuSFS**: `${{ github.event.inputs.variant }}`
            - **Hệ điều hành hỗ trợ (Target OS)**: `${{ github.event.inputs.target_os }}`
            - **Tệp đính kèm**: Flashable Kernel Zip & Manager APK mới nhất.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
