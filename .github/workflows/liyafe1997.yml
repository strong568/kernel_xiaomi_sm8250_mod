name: Build Kernel liyafe1997

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Select device code'
        required: true
        default: 'munch'
        type: choice
        options:
          - psyche
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa
      include_ksu:
        description: 'Does it include KSU?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        repository: liyafe1997/kernel_xiaomi_sm8250_mod
        ref: android15-lineage22-mod
        fetch-depth: 1
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar libelf-dev libfl-dev jq

    - name: Set build metadata
      id: vars
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-ccache-${{ github.event.inputs.device }}-${{ github.event.inputs.include_ksu }}-${{ env.SHORT_SHA }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.event.inputs.device }}-${{ github.event.inputs.include_ksu }}-${{ runner.os }}-ccache-${{ github.event.inputs.device }}-${{ runner.os }}-ccache-

    - name: Setup zyc-clang toolchain
      run: |
        mkdir -p $HOME/toolchain/zyc-clang
        cd $HOME/toolchain/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxf Clang-16.0.6-20260807.tar.gz
        rm Clang-16.0.6-20260807.tar.gz

        mkdir -p /home/runner/proton-clang
        ln -sf $HOME/toolchain/zyc-clang /home/runner/proton-clang/proton-clang-20210522
        cd $GITHUB_WORKSPACE
     - name: Verify SuSFS Patches
      if: ${{ github.event.inputs.include_ksu == 'true' }}
      run: |
        echo "================================================="
        echo "   KIỂM TRA CÁC PATCH SUSFS ĐÃ ÁP DỤNG TRONG SOURCE"
        echo "================================================="

        # 1. Liệt kê các commit liên quan đến SuSFS trong git history
        echo ">>> Danh sách commit SuSFS đã merge:"
        git log --oneline --grep -i "susfs" -n 20 || echo "Không tìm thấy commit có từ khóa susfs"

        # 2. Kiểm tra các file mã nguồn cốt lõi của SuSFS
        echo -e "\n>>> Kiểm tra file mã nguồn SuSFS:"
        found_files=0
        for file in "fs/susfs.c" "include/linux/susfs.h" "fs/susfs_defs.h" "include/linux/sus_su.h"; do
          if [ -f "$file" ]; then
            echo "  [✓] Đã có file: $file"
            found_files=$((found_files + 1))
          else
            echo "  [✗] Chưa có file: $file"
          fi
        done

        # 3. Kiểm tra các macro/patch SuSFS được khai báo trong source
        echo -e "\n>>> Kiểm tra cấu hình & phiên bản SuSFS:"
        if [ -f "include/linux/susfs.h" ]; then
          grep -E "SUSFS_VERSION|CONFIG_KSU_SUSFS" include/linux/susfs.h || true
        fi

        # 4. Kiểm tra xem defconfig hoặc Makefile đã kích hoạt SuSFS chưa
        echo -e "\n>>> Trạng thái SuSFS trong Makefile / Kconfig:"
        grep -rn "CONFIG_KSU_SUSFS" fs/ Makefile arch/arm64/configs/ 2>/dev/null | head -n 10 || echo "Chưa thấy config tĩnh trong source"

        echo "================================================="
        
    - name: Setup latest SukiSU KernelPatch
      if: ${{ github.event.inputs.include_ksu == 'true' }}
      run: |
        # Đổi link tải SukiSU trong build.sh sang repo chính thức nhánh main
        sed -i 's#curl -LSs "https://github.com/liyafe1997/SukiSU-Ultra/.*setup.sh".*#curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main#g' build.sh

        # Tải patch_linux mới nhất
        LATEST_URL="https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux"
        wget -q --content-disposition "$LATEST_URL" -O /tmp/patch_linux || {
          FALLBACK_URL=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest | jq -r '.assets[] | select(.name=="patch_linux") | .browser_download_url')
          wget -q "$FALLBACK_URL" -O /tmp/patch_linux
        }

        # Cấp quyền thực thi và đưa vào PATH toàn hệ thống lẫn thư mục hiện tại
        chmod +x /tmp/patch_linux
        
        # Lấy tag phiên bản từ release mới nhất
        PATCH_VER=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest | jq -r '.tag_name // "Latest"')
        echo "================================================="
        echo " [INFO] Phien ban patch_linux su dung: $PATCH_VER"
        echo "================================================="
        
        sudo cp /tmp/patch_linux /usr/local/bin/patch_linux
        cp /tmp/patch_linux ./patch_linux

        # Ngăn build.sh tải đè bản cũ nếu file đã tồn tại
        sed -i 's#wget.*SukiSU_KernelPatch_patch.*#echo "patch_linux already prepared"#' build.sh

        # In kiem tra noi dung build.sh tai ca 2 vi tri
        echo "=== NOI DUNG BUILD.SH TAI DONG 96-102 ==="
        sed -n '96,102p' build.sh

        echo "=== NOI DUNG BUILD.SH TAI DONG 164-173 ==="
        sed -n '164,173p' build.sh
        
        # Thong bao cac patch SuSFS hien co trong source
        echo "=== DANH SACH COMMIT / PATCH SUSFS DA CO ==="
        git log --oneline --grep -i "susfs" -n 15 || true
        [ -f include/linux/susfs.h ] && grep -E "SUSFS_VERSION" include/linux/susfs.h || echo "Chua co include/linux/susfs.h"


    - name: Build kernel
      run: |
        export CCACHE_DIR=~/.cache/ccache_mikernel
        export USE_CCACHE=1
        export PATH=/home/runner/proton-clang/proton-clang-20210522/bin:$PATH

        chmod +x build.sh
        if [ "${{ github.event.inputs.include_ksu }}" = "true" ]; then
          bash build.sh ${{ github.event.inputs.device }} ksu
        else
          bash build.sh ${{ github.event.inputs.device }}
        fi

    - name: Show ccache stats
      run: ccache -s

    - name: Prepare release files
      run: |
        mkdir -p release_files

        # Gom các file flashable zip
        for f in $(find . -maxdepth 2 -name "*.zip"); do
          base_name=$(basename "$f")
          cp "$f" "release_files/Kernel_liyafe1997_${{ github.event.inputs.device }}_${base_name}"
        done

        # Gom Image và dtb nếu có
        [ -f out/arch/arm64/boot/Image ] && cp out/arch/arm64/boot/Image release_files/Image-liyafe1997-${{ github.event.inputs.device }} || true
        [ -f out/arch/arm64/boot/dtb ] && cp out/arch/arm64/boot/dtb release_files/dtb-liyafe1997-${{ github.event.inputs.device }} || true

        echo "Build completed for ${{ github.event.inputs.device }} by liyafe1997" > release_files/build_info.txt

    - name: Upload Kernel to GitHub Actions Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-liyafe1997-${{ github.event.inputs.device }}-${{ env.BUILD_DATE }}
        path: release_files/*
        retention-days: 7

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: liyafe1997-${{ github.event.inputs.device }}-${{ env.BUILD_DATE }}
        name: "Kernel liyafe1997 ${{ github.event.inputs.device }} (${{ github.event.inputs.include_ksu == 'true' && 'KSU' || 'No-KSU' }}) -${{ env.BUILD_DATE }}"
        fail_on_unmatched_files: false
        body: |
          ### Thông tin bản dựng
          - **Thiết bị:** `${{ github.event.inputs.device }}`
          - **KernelSU:** `${{ github.event.inputs.include_ksu }}`
          - **Toolchain:** `ZyC-Clang 16.0.6 (20260807)`
          - **SukiSU KernelPatch:** `Latest (GitHub Releases)`
          - **Thời gian build:** `${{ env.BUILD_DATE }}`

          ---
          ### Nguồn Kernel
          - **Tác giả:** [liyafe1997](https://github.com/liyafe1997)
          - **Repository:** [liyafe1997/kernel_xiaomi_sm8250_mod](https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod)
          - **Branch:** `android15-lineage22-mod`
          - **Source Commit:** [`${{ env.SHORT_SHA }}`](https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod/commit/${{ env.COMMIT_SHA }})
        files: |
          release_files/*
