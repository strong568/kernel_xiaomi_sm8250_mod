name: Build Ki-Kernel with Multi-KSU

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device (munch, alioth, etc.)'
        required: true
        default: 'munch'
      ksu_flavor:
        description: 'Chọn loại Root Engine'
        required: true
        default: 'resukisu'
        type: choice
        options:
          - resukisu
          - bakasu
          - ksuNext
          - noksu
      enable_susfs:
        description: 'Bật SuSFS ẩn Root Full'
        required: true
        default: true
        type: boolean
      target_os:
        description: 'Target OS'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - miui
          - aosp
          - coloros

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false


      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            crossbuild-essential-arm64 libarchive-tools zip unzip tar wget git curl \
            python3 libzstd-dev ccache jq rsync patch

      - name: Setup ZyCromerZ Clang 16
        run: |
          mkdir -p "$HOME/zyc-clang"
          echo 'Downloading ZyCromerZ Clang 16...'
          curl -sL "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz" -o /tmp/zyc-clang.tar.gz
          tar -xzf /tmp/zyc-clang.tar.gz -C "$HOME/zyc-clang/"
          rm -f /tmp/zyc-clang.tar.gz

          mkdir -p "$HOME/proton-clang"
          ln -sfn "$HOME/zyc-clang" "$HOME/proton-clang/proton-clang-20210522"
          echo "$HOME/zyc-clang/bin" >> $GITHUB_PATH

      - name: Setup Root Engine & Patch SuSFS
        run: |
          FLAVOR="${{ github.event.inputs.ksu_flavor }}"
          USE_SUSFS="${{ github.event.inputs.enable_susfs }}"
          rm -rf KernelSU drivers/kernelsu susfs4ksu

          if [ "$FLAVOR" == "resukisu" ]; then
            echo "Cloning ReSukiSU..."
            git clone --depth=1 https://github.com/resukisu/KernelSU.git -b main KernelSU
            ln -sfn ../KernelSU/kernel drivers/kernelsu
            REPO_MANAGER="resukisu/KernelSU"
            KSU_NAME="ReSukiSU"

          elif [ "$FLAVOR" == "bakasu" ]; then
            echo "Setting up BakaSU..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -
            REPO_MANAGER="Baka-SU/BakaSU"
            KSU_NAME="BakaSU"

          elif [ "$FLAVOR" == "ksuNext" ]; then
            echo "Setting up KernelSU-Next..."
            git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b next KernelSU
            ln -sfn ../KernelSU/kernel drivers/kernelsu
            REPO_MANAGER="KernelSU-Next/KernelSU-Next"
            KSU_NAME="KernelSU-Next"

          else
            echo "NOKSU selected - skipping root integration."
            REPO_MANAGER=""
            KSU_NAME="Vanilla"
          fi

          SUSFS_TAG="NoSuSFS"
          if [ "$USE_SUSFS" = "true" ] && [ "$FLAVOR" != "noksu" ]; then
            echo "Cloning and applying SuSFS for Kernel 4.19..."
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs4ksu

            cp -vf susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
            cp -vf susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true

            KERNEL_PATCH=$(ls susfs4ksu/kernel_patches/*4.19*.patch 2>/dev/null | head -n 1)
            if [ -n "$KERNEL_PATCH" ]; then
              patch -p1 --forward < "$KERNEL_PATCH" || echo "Kernel patch skipped or already applied."
            fi

            cp -vf susfs4ksu/kernel_patches/KernelSU/kernel/* KernelSU/kernel/ 2>/dev/null || true
            KSU_PATCH=$(ls susfs4ksu/kernel_patches/*KernelSU*.patch 2>/dev/null | head -n 1)
            if [ -n "$KSU_PATCH" ]; then
              cd KernelSU
              patch -p1 --forward < "../$KSU_PATCH" || echo "KSU patch skipped or already applied."
              cd ..
            fi

            SUSFS_VER=$(grep -m 1 "SUSFS_VERSION" include/linux/susfs.h 2>/dev/null | cut -d '"' -f 2 || echo "v1.5.5")
            SUSFS_TAG="SuSFS_${SUSFS_VER}"
          fi

          DRIVER_VER="unknown"
          if [ -f "KernelSU/kernel/core_hook.c" ]; then
            DRIVER_VER="v"$(grep -m 1 "KSU_VERSION" KernelSU/kernel/core_hook.c | grep -o '[0-9]\+' || echo "unknown")
          fi

          BUILD_DATE=$(date +'%Y%m%d_%H%M')
          echo "KSU_NAME=${KSU_NAME}" >> $GITHUB_ENV
          echo "SUSFS_TAG=${SUSFS_TAG}" >> $GITHUB_ENV
          echo "REPO_MANAGER=${REPO_MANAGER}" >> $GITHUB_ENV
          echo "DRIVER_VER=${DRIVER_VER}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Setup AnyKernel3
        run: |
          rm -rf anykernel_template
          mkdir -p anykernel_template
          git clone --depth=1 https://github.com/AstideLabs/AnyKernel3 -b kona anykernel_template/ak3_base
          cp -r anykernel_template/ak3_base/* anykernel_template/
          rm -rf anykernel_template/ak3_base

          # Tải trực tiếp script anykernel.sh từ nhánh của bạn, không cần nhúng cat EOF
          curl -sLo anykernel_template/anykernel.sh "https://raw.githubusercontent.com/strong568/kernel_xiaomi_sm8250_mod/refs/heads/ki-kernel-clean-stable/anykernel_template/anykernel.sh"
          chmod +x anykernel_template/anykernel.sh

      - name: Compile Kernel Images
        run: |
          TARGET_DEVICE="${{ github.event.inputs.target_device }}"
          FLAVOR="${{ github.event.inputs.ksu_flavor }}"
          USE_SUSFS="${{ github.event.inputs.enable_susfs }}"
          TARGET_OS="${{ github.event.inputs.target_os }}"

          export PATH="$HOME/zyc-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export LD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export KBUILD_BUILD_USER="strong568"
          export KBUILD_BUILD_HOST="github-actions"

          MAKE_ARGS="ARCH=arm64 SUBARCH=arm64 O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          mkdir -p build_artifacts/aosp build_artifacts/miui

          apply_ksu_config() {
            if [ "$FLAVOR" != "noksu" ]; then
              scripts/config --file out/.config \
                -e KSU \
                -e THREAD_INFO_IN_TASK \
                -d KSU_KPROBES_HOOK \
                -e KSU_THRONE_TRACKER_ALWAYS_THREADED \
                -e KSU_LSM_SECURITY_HOOKS \
                -e KSU_MULTI_MANAGER_SUPPORT

              if [ "$USE_SUSFS" = "true" ]; then
                scripts/config --file out/.config \
                  -e KSU_SUSFS \
                  -e KSU_SUSFS_SUS_PATH \
                  -e KSU_SUSFS_SUS_MOUNT \
                  -e KSU_SUSFS_SUS_KSTAT \
                  -e KSU_SUSFS_SUS_OVERLAYFS \
                  -e KSU_SUSFS_SUS_SU \
                  -e KSU_SUSFS_SPOOF_UNAME \
                  -e KSU_SUSFS_OPEN_REDIRECT \
                  -e KSU_SUSFS_AUTO_ADD_SUS_KSURULES \
                  -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
                  -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                  -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                  -e KSU_SUSFS_ENABLE_LOG
              fi
            else
              scripts/config --file out/.config -d KSU -d KSU_SUSFS
            fi
          }

          if [ "$TARGET_OS" == "aosp" ] \vert{}\vert{} [ "$TARGET_OS" == "both" ]; then
            echo ">>> Building AOSP Kernel <<<"
            rm -rf out/
            make $MAKE_ARGS "${TARGET_DEVICE}_defconfig"
            apply_ksu_config
            make $MAKE_ARGS olddefconfig
            make $MAKE_ARGS -j$(nproc --all)

            if [ -f "arch/arm64/boot/dts/gpu_profiles/kona-v2-gpu-extreme.dtsi" ]; then
              cp -f arch/arm64/boot/dts/gpu_profiles/kona-v2-gpu-extreme.dtsi arch/arm64/boot/dts/vendor/qcom/kona-v2-gpu.dtsi
            fi
            make $MAKE_ARGS dtbs -j$(nproc --all)

            cp out/arch/arm64/boot/Image build_artifacts/aosp/Image
            if [ -f "out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb" ]; then
              cp out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb build_artifacts/aosp/dtb
            else
              find out/arch/arm64/boot/dts -name '*.dtb' | sort | head -n 1 | xargs cat > build_artifacts/aosp/dtb
            fi
          fi

          if [ "$TARGET_OS" == "miui" ] || [ "$TARGET_OS" == "coloros" ] \vert{}\vert{} [ "$TARGET_OS" == "both" ]; then
            echo ">>> Building MIUI / HyperOS Kernel <<<"
            rm -rf out/
            make $MAKE_ARGS "${TARGET_DEVICE}_defconfig"
            apply_ksu_config

            scripts/config --file out/.config \
              -e EROFS_FS -e EROFS_FS_XATTR -e EROFS_FS_POSIX_ACL -e EROFS_FS_SECURITY -e EROFS_FS_ZIP \
              -d PSTORE_COMPRESS --set-str STATIC_USERMODEHELPER_PATH "" \
              -d SF_BINDER -d MILLET -d MIGT -d MIGT_ENERGY_MODEL -d BOOTUP_RECLAIM -d MI_RECLAIM \
              -e XIAOMI_MIUI -e TECHPACK_CAMERA_XIAOMI -e OVERLAY_FS -d DEBUG_FS

            make $MAKE_ARGS olddefconfig
            make $MAKE_ARGS -j$(nproc --all)

            if [ -f "arch/arm64/boot/dts/gpu_profiles/kona-v2-gpu-extreme.dtsi" ]; then
              cp -f arch/arm64/boot/dts/gpu_profiles/kona-v2-gpu-extreme.dtsi arch/arm64/boot/dts/vendor/qcom/kona-v2-gpu.dtsi
            fi
            make $MAKE_ARGS dtbs -j$(nproc --all)

            cp out/arch/arm64/boot/Image build_artifacts/miui/Image
            if [ -f "out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb" ]; then
              cp out/arch/arm64/boot/dts/vendor/qcom/kona-v2.1.dtb build_artifacts/miui/dtb
            else
              find out/arch/arm64/boot/dts -name '*.dtb' | sort | head -n 1 | xargs cat > build_artifacts/miui/dtb
            fi
          fi

      - name: Package AnyKernel3 Zip
        run: |
          TARGET_DEVICE="${{ github.event.inputs.target_device }}"
          TARGET_OS="${{ github.event.inputs.target_os }}"

          mkdir -p anykernel_template/kernels/aosp anykernel_template/kernels/miui anykernel_template/kernels/coloros

          if [ "$TARGET_OS" == "aosp" ]; then
            cp build_artifacts/aosp/Image anykernel_template/kernels/aosp/Image
            cp build_artifacts/aosp/dtb anykernel_template/kernels/aosp/dtb
          elif [ "$TARGET_OS" == "miui" ]; then
            cp build_artifacts/miui/Image anykernel_template/kernels/miui/Image
            cp build_artifacts/miui/dtb anykernel_template/kernels/miui/dtb
          elif [ "$TARGET_OS" == "coloros" ]; then
            cp build_artifacts/miui/Image anykernel_template/kernels/coloros/Image
            cp build_artifacts/miui/dtb anykernel_template/kernels/coloros/dtb
          else
            cp build_artifacts/aosp/Image anykernel_template/kernels/aosp/Image
            cp build_artifacts/aosp/dtb anykernel_template/kernels/aosp/dtb
            cp build_artifacts/miui/Image anykernel_template/kernels/miui/Image
            cp build_artifacts/miui/dtb anykernel_template/kernels/miui/dtb
            cp build_artifacts/miui/Image anykernel_template/kernels/coloros/Image
            cp build_artifacts/miui/dtb anykernel_template/kernels/coloros/dtb
          fi

          ZIP_NAME="Ki-Kernel-SM8250-${BUILD_DATE}-${TARGET_DEVICE}-${KSU_NAME}-${SUSFS_TAG}-${DRIVER_VER}-${TARGET_OS}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          cd anykernel_template
          zip -r9 "../${ZIP_NAME}" ./* -x .git .gitignore "ak3_base/*"
          cd ..

      - name: Fetch Manager APK
        run: |
          mkdir -p managers
          REPO="${{ env.REPO_MANAGER }}"
          if [ -n "$REPO" ]; then
            echo "Fetching Manager APK from $REPO..."
            REL_JSON=$(curl -sL "https://api.github.com/repos/${REPO}/releases/latest")
            APK_URL=$(echo "$REL_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
            APK_NAME=$(echo "$REL_JSON" | jq -r '.assets[] | select(.name | endswith(".apk")) | .name' | head -n 1)

            if [ -n "$APK_URL" ] && [ "$APK_URL" != "null" ]; then
              curl -Lo "managers/${APK_NAME:-Manager-Release.apk}" "$APK_URL"
            fi
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ env.BUILD_DATE }}"
          name: "Ki-Kernel SM8250 [${{ env.KSU_NAME }} + ${{ env.SUSFS_TAG }}] -${{ env.BUILD_DATE }}"
          body: |
            ### 🚀 Thông tin bản build
            - **Thiết bị:** `${{ github.event.inputs.target_device }}`
            - **Root Engine:** `${{ env.KSU_NAME }}`
            - **SuSFS:** `${{ env.SUSFS_TAG }}`
            - **Driver API:** `${{ env.DRIVER_VER }}`
            - **Target OS:** `${{ github.event.inputs.target_os }}`
            - **Thời gian build:** `${{ env.BUILD_DATE }}`

            ### 📦 Tệp đính kèm:
            - **Kernel Flashable Zip:** `${{ env.ZIP_NAME }}`
            - **Manager APK:** File APK tương ứng với engine đã chọn (nằm trong danh sách assets).
          files: |
            ${{ env.ZIP_NAME }}
            managers/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
